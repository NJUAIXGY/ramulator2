# Functional test: `TieredM3D` should serialize two same-channel accesses from
# different tiers when the shared channel access budget is 1.
#
# Expected behavior:
# - Warm up two rows in different tiers under `Mono3DTiered`.
# - Re-issue two row-hit reads in the same cycle.
# - `shared_access_ports_per_channel: 1` forces different completion cycles even
#   though the requests target different tiers/banks.
# - Timing overrides intentionally remove device-level channel CAS spacing so the
#   controller-level shared-port bottleneck is directly observable.

Frontend:
  impl: Scripted
  clock_ratio: 1
  max_cycles: 5000
  script:
    - type: read
      addr: 0x0000
      at: 0
    - type: read
      addr: 0x2000
      at: 1
    - type: read
      addr: 0x0000
      at: 20
    - type: read
      addr: 0x2000
      at: 20
  expectations:
    - kind: different_done_cycle
      a: 2
      b: 3

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: Mono3DTiered
    org:
      channel_width: 256
      prefetch_size: 1
      channel: 1
      tier: 4
      bankgroup: 1
      bank: 8
      row: 256
      column: 256
      dq: 256
    timing:
      preset: Mono3DTiered_Default
      tCK_ps: 2500
      nBL: 0
      nCL: 4
      nCWL: 4
      nRCD: 2
      nRTP: 2
      nWR: 2
      nRAS: 4
      nRP: 2
      nRC: 6
      nWTR: 0
      nRTW: 0
      nCCDS: 0
      nRRDS: 0
      nFAW: 0

  Controller:
    impl: TieredM3D
    write_completion_mode: posted
    cmd_issue_width_per_channel: 4
    shared_access_ports_per_channel: 1
    tier_access_ports: 1
    vertical_transfer_ports: 0
    active_buffer_max_size: 128
    read_buffer_max_size: 128
    write_buffer_max_size: 128
    priority_buffer_max_size: 128
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: None
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
