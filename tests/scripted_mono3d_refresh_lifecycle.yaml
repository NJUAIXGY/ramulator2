# Controlled refresh lifecycle smoke for Mono3D + BankParallel.
#
# Intent:
# - Keep one row open with an early read.
# - Let `AllBankRefresh` inject a refresh while the row is still open, so the
#   controller must hold the refresh request pending and issue `PREA` first.
# - Observe non-zero `controller_refresh_*` stats and verify post-refresh reads
#   still complete.
#
# Run:
#   "third_party/ramulator2/build/ramulator2" \
#     -f "third_party/ramulator2/tests/scripted_mono3d_refresh_lifecycle.yaml"

Frontend:
  impl: Scripted
  clock_ratio: 1
  max_cycles: 59
  script:
    - { type: read, addr: 0x0, at: 0 }
    - { type: read, addr: 0x0, at: 40 }
  expectations:
    - { kind: order, before: 0, after: 1 }

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: Mono3D
    org:
      channel_width: 256
      prefetch_size: 1
      channel: 1
      rank: 1
      bankgroup: 1
      bank: 8
      row: 1024
      column: 256
      dq: 256
    timing:
      preset: Mono3D_Default
      nRCD: 4
      nRP: 4
      nRAS: 8
      nRFC: 4
      nREFI: 30

  Controller:
    impl: BankParallel
    cmd_issue_width_per_layer: 1
    access_ports_per_layer: 1
    write_completion_mode: data
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy

  AddrMapper:
    impl: RoBaRaCoCh
